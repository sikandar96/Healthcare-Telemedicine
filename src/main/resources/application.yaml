spring:
  application:
    name: Healthcare-Telemedicine
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/Healthcare-Telemedicine}

server:
  port: 9008

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    header: ${JWT_HEADER:Authorization}
    prefix: ${JWT_PREFIX:Bearer}
    issuer: ${JWT_ISSUER:healthcare-telemedicine}
  default-admin:
    create: ${APP_DEFAULT_ADMIN_CREATE:false}
    username: ${APP_DEFAULT_ADMIN_USERNAME:}
    password: ${APP_DEFAULT_ADMIN_PASSWORD:}
  reminders:
    cron: ${APP_REMINDERS_CRON:0 0 8 * * *}
  otp:
    channel: ${APP_OTP_CHANNEL:email}
    email:
      from: ${APP_OTP_EMAIL_FROM:}
    sms:
      webhook-url: ${APP_OTP_SMS_WEBHOOK_URL:}
    expose-in-response: ${APP_OTP_EXPOSE_IN_RESPONSE:false}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    use-root-path: true
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"
  level:
    root: INFO
    com.health.care: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
